name: "setup-nix"
description: "Install Nix and restore this job's Nix store from the Actions cache"

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 5G
